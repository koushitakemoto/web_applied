<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>キーボードで動かす</title>
    <style>
        .stage{
        position: relative;
        width: 600px;
        height: 240px;
        margin: 24px auto;
        border: 2px solid #f44545;
        background: #252f54;
        overflow: hidden;
        }
        #box{
        position: absolute;
        width: 48px;
        height: 48px;
        background: #afcafc;
        border-radius: 8px;
        }
    </style>
</head>
<body>
    <p style="text-align: center;">← / → で赤い四角が動きます</p>
    <div class="stage" id="stage">
        <div id="box"></div>
    </div>

    <script>
        const box=document.getElementById("box");

        let x=50;
        let y=96;
        const speed=10;

        const keys={};

        document.addEventListener("keydown",(e) =>{
            keys[e.code]=true;
            console.log(keys);
        });
        document.addEventListener("keyup",(e) =>{
            keys[e.code]=false;
        });

        function draw(){
            box.style.left=x+"px";
            box.style.top=y+"px";
        }
        
        function update(){
            if(keys["ArrowRight"]||keys["KeyD"]){
            x=x+speed;
            }
            if(keys["ArrowLeft"]||keys["KeyA"]){
            x=x-speed;
            }
            if(keys["ArrowDown"]||keys["KeyS"]){
            y=y+speed;
            }
            if(keys["ArrowUp"]||keys["KeyW"]){
            y=y-speed;
            }
            

            if(x<0){
                x=0;
            }
            if(x>600-48){
                x=600-48;
            }
             if(y<0){
                y=0;
            }
            if(y>240-48){
                y=240-48;
            }
            console.log(x,keys);
            draw();
        }

        setInterval(update,16);
    </script>

</body>
</html>
